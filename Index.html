<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #f363bc;
            --secondary: #7dcfff;
            --accent: #e3f2fd;
            --dark: #263238;
            --light: #f5f7fa;
            --muted: #607d8b;
        }

        body {
            font-family: 'Segoe UI', Roboto, 'Times New Roman', Times, serif;
            background: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%);
            min-height: 100vh;
            padding: 40px 20px;
            color: var(--dark);
            line-height: 1.7;
        }

        .profile-wrapper {
            max-width: 850px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(13, 71, 161, 0.12);
            overflow: hidden;
        }

        /* Header Section */
        .profile-header {
            background: linear-gradient(90deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            padding: 40px 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .header-info {
            flex: 1;
            min-width: 300px;
        }

        .header-info h1 {
            font-size: 32px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-bottom: 8px;
        }

        .tagline {
            font-size: 17px;
            opacity: 0.9;
            margin-bottom: 15px;
            font-weight: 400;
        }

        .contact-details p {
            font-size: 15px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .contact-details a {
            color: #fff;
            text-decoration: none;
            opacity: 0.9;
            transition: opacity 0.2s;
        }

        .contact-details a:hover {
            opacity: 1;
            text-decoration: underline;
        }

        .profile-picture-container {
            flex-shrink: 0;
        }

        .profile-photo {
            width: 160px;
            height: 200px;
            border: 4px solid rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            object-fit: cover;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.2);
        }

        /* Main Content */
        .profile-body {
            padding: 35px;
        }

        .section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
            padding-bottom: 8px;
            border-bottom: 2px solid var(--accent);
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px 25px;
        }

        .info-item {
            display: flex;
            flex-direction: column;
        }

        .info-item.full-width {
            grid-column: 1 / -1;
        }

        .info-label {
            font-weight: 600;
            color: var(--dark);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .info-value {
            font-size: 15px;
            color: #37474f;
            padding-top: 2px;
        }

        .divider-row {
            grid-column: 1 / -1;
            height: 1px;
            background: #e0e0e0;
            margin: 8px 0;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .info-grid {
                grid-template-columns: 1fr;
            }
            .profile-header {
                justify-content: center;
                text-align: center;
            }
            .contact-details p {
                justify-content: center;
            }
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Times New Roman", Times, serif;
            background: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%);
            min-height: 100vh;
            padding: 40px 20px;
            color: #1e293b;
            line-height: 1.7;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.12);
            overflow: hidden;
        }

        .header-bar {
            background: linear-gradient(90deg, #73eaff 0%, #ff6de7 100%);
            padding: 30px 40px;
            color: white;
        }

        .header-bar h1 {
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            font-family: "Times New Roman", Times, serif;
        }

        .header-bar p {
            margin-top: 6px;
            opacity: 0.85;
            font-size: 1rem;
            font-family: "Times New Roman", Times, serif;
        }

        .content {
            padding: 35px 40px;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }

        tr {
            transition: background-color 0.25s ease;
        }

        tr:hover {
            background-color: #f1f8ff;
        }

        td {
            padding: 20px 12px;
            border-bottom: 1px solid #e2e8f0;
            vertical-align: top;
            font-family: "Times New Roman", Times, serif;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .level {
            font-weight: 700;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #0f4c75;
            width: 26%;
        }

        .details {
            width: 59%;
        }

        .details .school-name {
            font-weight: 600;
            font-size: 1.05rem;
            color: #1e293b;
        }

        .details .program {
            color: #2563eb;
            font-weight: 500;
            margin: 4px 0;
        }

        .details .address {
            font-size: 1rem;
            color: #64748b;
            margin-top: 4px;
        }

        .year {
            width: 15%;
            text-align: right;
            font-weight: 600;
            color: #1e88e5;
            font-size: 1rem;
        }

        .tertiary-badge {
            display: inline-block;
            margin-top: 8px;
            background: #dbeafe;
            color: #1e40af;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        @media (max-width: 600px) {
            .content {
                padding: 25px 20px;
            }
            .header-bar {
                padding: 25px 20px;
            }
            td {
                display: block;
                width: 100%;
            }
            .year {
                text-align: left;
                padding-top: 0;
                padding-bottom: 15px;
            }
        }
    </style>
</head>
